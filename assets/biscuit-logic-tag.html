<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biscuit Logic Tag</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }

  .tag {
    position: fixed;
    right: 28px;
    bottom: 24px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 11px 8px 9px;
    border: 1px solid rgba(255,255,255,.34);
    border-radius: 8px;
    background: rgba(15,15,15,.58);
    color: rgba(255,255,255,.88);
    font: 600 15px/1.0 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    letter-spacing: .13em;
    box-shadow: 0 3px 14px rgba(0,0,0,.18);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    user-select: none;
  }

  .biscuit {
    position: relative;
    width: 18px;
    height: 18px;
    flex: 0 0 18px;
    border-radius: 50%;
    background: rgba(255,255,255,.88);
  }

  .biscuit::before {
    content: "";
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    left: 4px;
    top: 5px;
    background: rgba(15,15,15,.62);
    box-shadow:
      7px -1px 0 rgba(15,15,15,.62),
      4px 6px 0 rgba(15,15,15,.62),
      9px 7px 0 rgba(15,15,15,.62);
  }
</style>
</head>
<body>
  <div class="tag" aria-label="Biscuit Logic">
    <span class="biscuit" aria-hidden="true"></span>
    <span>BISCUIT LOGIC</span>
  </div>
</body>
</html>
